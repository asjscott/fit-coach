name: CI
# Once per commit: pushes to the long-lived branches, and every pull request (which covers its branch's pushes)
on:
  push:
    branches: [dev, main]
  pull_request:

# A new push to the same branch or pull request cancels the run it replaces
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Usually about 5 minutes; a hang stops here instead of using up the month's minutes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generates expo-env.d.ts, which typechecking and the typed lint rule need
      - run: pnpm --filter @fit/mobile exec expo customize tsconfig.json
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # What Render runs for the API, and what the app ships, so a broken build or import fails here first
      - run: pnpm --filter @fit/api build
      - run: pnpm --filter @fit/mobile exec expo export --platform web
      - run: pnpm --filter @fit/mobile exec expo export --platform ios
